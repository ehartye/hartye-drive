<!--
  The home-screen icon, drawn from the product's own sign vocabulary and
  nothing else (grounding §2 signature: no clipart, no photography).

  It is a **guide sign**: the same construction as `squareFace(C.green,
  C.white)` in `src/signs/geometry/shared.tsx` — a guide-green field with a
  white inset border and a white Overpass legend — because guide green
  (`--color-guide` #04684E) is the app's primary brand colour and a guide sign
  is what tells a driver where they are going. The legend sets in Overpass, the
  open-source face derived from FHWA Highway Gothic that letters every sign in
  the registry.

  Colours are §2 tokens verbatim: #04684E (guide green) and #F2F4F1 (sign
  white). Rasterized to PNG by `npm run icons`; nothing here is shipped.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect x="0" y="0" width="512" height="512" rx="72" fill="#04684E" />
  <rect
    x="40"
    y="40"
    width="432"
    height="432"
    rx="40"
    fill="none"
    stroke="#F2F4F1"
    stroke-width="18"
  />
  <text
    x="256"
    y="332"
    fill="#F2F4F1"
    font-size="230"
    font-family="Overpass"
    font-weight="800"
    letter-spacing="4"
    text-anchor="middle"
  >TN</text>
</svg>
