<!doctype html><html><head><meta charset="utf-8"><title>audit</title></head>
<body style="margin:0;background:#000">
<iframe id="fr" style="width:320px;height:1000px;border:0"></iframe>
<script>
window.setW = w => { document.getElementById('fr').style.width = w+'px'; };
window.loadIt = (f) => new Promise(res=>{
  const fr=document.getElementById('fr');
  fr.onload=()=>setTimeout(()=>res(true),400);
  fr.src='/'+f+'.html';
});
window.overflowScan = () => {
  const fr=document.getElementById('fr'), d=fr.contentDocument, w=fr.contentWindow;
  const vw = w.innerWidth;
  const res = {vw, docScrollW: d.documentElement.scrollWidth, bodyScrollW: d.body.scrollWidth, offenders:[]};
  d.querySelectorAll('*').forEach(el=>{
    if (el.closest('.mock-label')) return;
    const r = el.getBoundingClientRect();
    if (r.width===0&&r.height===0) return;
    if (r.right > vw + 1 || r.left < -1) {
      const cs=w.getComputedStyle(el);
      if(cs.position==='fixed'&&r.width<=vw+1) return;
      res.offenders.push({tag:el.tagName, cls:String(el.className&&el.className.baseVal!==undefined?el.className.baseVal:el.className).slice(0,40), left:Math.round(r.left), right:Math.round(r.right), w:Math.round(r.width), tx:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,40)});
    }
  });
  // dedupe by ancestor: keep only elements whose parent isn't already an offender
  const set=new Set(res.offenders.map(o=>o.cls+o.left+o.right));
  res.offenders = res.offenders.slice(0,12);
  return res;
};
</script></body></html>
