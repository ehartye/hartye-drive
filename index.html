<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161A" />
    <meta
      name="description"
      content="Offline-first study app for the Tennessee Class D knowledge test. Every answer cites the official manual. Not affiliated with the State of Tennessee."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      iOS never reads the manifest's icons and applies its own mask, so it gets
      the safe-zone drawing. Same guide sign, rasterized by `npm run icons`.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TN Drive" />

    <!--
      The four faces are self-hosted woff2 and precached by the service worker
      (grounding §2, practices F5) — that, not a preload hint, is what makes the
      app work at zero bytes of network.

      They are deliberately **not** preloaded. Measured on Slow 4G with a 4× CPU
      throttle, two `rel="preload"` font links took 59 KB of the first parallel
      batch and pushed the first question from 2.15 s to 2.60 s: on a slow link
      the fonts were competing with the code that draws the question. They now
      load at their natural priority, `font-display: swap` covers the first
      paint, and every visit after the first is served from the precache with no
      swap at all. See deviations.md, 2026-08-12 (P9) §2.
    -->

    <title>TN Drive · Tennessee Class D knowledge test</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #f2f4f1; background: #14161a">
        TN Drive needs JavaScript. Everything runs on your device — there is no server to fall back
        to.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
