<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161A" />
    <meta
      name="description"
      content="Offline-first study app for the Tennessee Class D knowledge test. Every answer cites the official manual. Not affiliated with the State of Tennessee."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Self-hosted faces (grounding §2, practices F5). Preloaded rather than
      fetched from a CDN: the app makes zero font requests at runtime and must
      work at zero bytes of network after first load.
    -->
    <link
      rel="preload"
      href="/fonts/overpass-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/overpass-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>TN Drive · Tennessee Class D knowledge test</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #f2f4f1; background: #14161a">
        TN Drive needs JavaScript. Everything runs on your device — there is no server to fall back
        to.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
